[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=300"

[dev]
  framework = "#static"
  publish = "public"
  port = 8888

# Fotos y fuentes: el nombre lleva una huella del contenido, así que se pueden guardar un año en el cel.
# Si cambias una foto, se guarda con otro nombre y el cel baja la nueva.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=300"

# El service worker se revisa siempre para que los cambios lleguen pronto
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
